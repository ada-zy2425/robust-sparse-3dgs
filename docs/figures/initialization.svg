<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title"><title id="title">Initialization root cause and controlled repair</title><rect width="1000" height="260" rx="18" fill="#f7f9fc"/><g font-family="sans-serif" fill="#203047"><text x="30" y="40" font-size="23" font-weight="bold">Initialization failure: locate, compare, verify</text><g font-size="18"><rect x="30" y="65" width="280" height="105" rx="12" fill="#e9eff6"/><text x="48" y="100" font-weight="bold">Duplicate neighborhoods</text><text x="48" y="130">Zero KNN scale → log(0)</text><text x="330" y="122">→</text><rect x="375" y="65" width="250" height="105" rx="12" fill="#e0f0f3"/><text x="392" y="100" font-weight="bold">Shared scale floor</text><text x="392" y="130">dtype + scene relative</text><text x="645" y="122">→</text><rect x="690" y="65" width="280" height="105" rx="12" fill="#eee9f5"/><text x="707" y="100" font-weight="bold">4 / 8 scales repaired</text><text x="707" y="130">Points + colors unchanged</text></g><text x="30" y="207" font-size="16">Bonsai / room pre-BA snapshots; zero post-BA scales changed.</text><text x="30" y="235" font-size="15">Mechanism diagram grounded in initialization diagnostics; not a reconstruction rendering.</text></g></svg>