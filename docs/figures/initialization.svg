<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Sparse-view 3DGS workflow and initialization repair</title><desc id="desc">Four-stage schematic: train photos, camera and point initialization, bounded gsplat training, and held-out evaluation with export. Numerical diagnosis locates zero-distance duplicate neighborhoods before forward; a shared dtype and scene relative floor repairs only four and eight scales on two snapshots.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14243e"/><stop offset="1" stop-color="#243052"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7287a5"/></marker></defs><rect width="1000" height="370" rx="20" fill="url(#bg)"/><g font-family="sans-serif"><text x="34" y="39" fill="#74d3d8" font-size="12" font-weight="bold" letter-spacing="2">GEOMETRY · RELIABILITY · DELIVERY</text><text x="34" y="82" fill="#fff" font-size="31" font-weight="bold">From sparse photos to inspectable 3D</text><text x="34" y="110" fill="#bcc9db" font-size="15">Train-only inputs. Matched experiments. Measured held-out results.</text><g fill="#293b56" stroke="#4a5d7a"><rect x="34" y="140" width="202" height="87" rx="12"/><rect x="275" y="140" width="202" height="87" rx="12"/><rect x="516" y="140" width="202" height="87" rx="12"/><rect x="757" y="140" width="209" height="87" rx="12"/></g><g stroke="#7287a5" stroke-width="2" marker-end="url(#arrow)"><path d="M243,184 H267"/><path d="M484,184 H508"/><path d="M725,184 H749"/></g><g fill="#fff" font-size="18" font-weight="bold"><text x="52" y="173">Sparse train views</text><text x="293" y="173">Camera + points</text><text x="534" y="173">3DGS training</text><text x="775" y="173">Inspect + export</text></g><g fill="#c0cede" font-size="13"><text x="52" y="200">Immutable split / hashes</text><text x="293" y="200">COLMAP / VGGT</text><text x="534" y="200">Pinned gsplat / budget</text><text x="775" y="200">Held-out / PLY / WebGL</text></g><path d="M34,249 H966" stroke="#405270"/><text x="34" y="280" fill="#74d3d8" font-size="13" font-weight="bold">ROOT-CAUSE REPAIR</text><text x="34" y="310" fill="#fff" font-size="19">Duplicate points → zero KNN scale → log(0)</text><text x="558" y="280" fill="#c6b5ee" font-size="13" font-weight="bold">CONTROLLED INTERVENTION</text><text x="558" y="310" fill="#fff" font-size="19">4 / 8 scales guarded; points + colors intact</text><text x="34" y="349" fill="#aab9ce" font-size="12">Schematic, not a reconstruction image. Clamp counts: bonsai / room pre-BA; zero post-BA clamps.</text></g></svg>
